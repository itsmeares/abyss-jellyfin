name: Theme tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'abyss*.css'
      - 'styles/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/theme-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'abyss*.css'
      - 'styles/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/theme-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run theme tests
        run: npm test
